name: Fix Builder Manifest Compatibility

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix addon builder manifest access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('addon.js')
          s = p.read_text()
          old = 'manifest: builder.getManifest(),'
          new = 'manifest: builder.manifest,'
          if old not in s:
              raise SystemExit('Target builder.getManifest() expression not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit addon fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add addon.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use builder manifest in worker'
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-builder-manifest.yml
          git commit -m 'chore: remove temporary fix workflow'
          git push

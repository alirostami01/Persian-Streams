name: Fix Quick Search Filter

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove post-kind filter and self-delete
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          p = Path('addon.js')
          s = p.read_text()
          old = "return r._kind === 'post' && candidateImdb === requestedImdb;"
          new = "return candidateImdb === requestedImdb;"
          if old not in s:
              raise SystemExit('Target condition not found')
          p.write_text(s.replace(old, new, 1))
          PY

          rm -f .github/workflows/fix-remove-post-filter.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon.js .github/workflows/fix-remove-post-filter.yml
          git commit -m "fix: relax quick-search result filter"
          git push

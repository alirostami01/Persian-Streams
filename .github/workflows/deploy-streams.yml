name: Deploy Streams Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker.js'
      - 'stremio-builder.js'
      - 'addon.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'publishToCentral.js'
      - 'assets/**'
      - '.github/workflows/deploy-streams.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-streams-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy stremio-streams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix duplicate displayed stream formats
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('addon.js')
          text = path.read_text()
          pattern = re.compile(r"  // Validate stream objects and remove duplicate URLs\\..*?\\n  return validStreams;", re.S)
          replacement = '''  // Keep one stream for each displayed format. The source can expose
  // the same format through multiple links, sometimes with different URLs.
  const seenStreamFormats = new Set();
  const validStreams = streams.filter(s => {
    if (!s || !s.url || typeof s.url !== 'string' || !s.url.startsWith('http')) {
      return false;
    }

    const formatIdentity = String(s.name || s.title || '')
      .replace(/\\s+/g, ' ')
      .trim()
      .toLowerCase();

    if (!formatIdentity) return true;
    if (seenStreamFormats.has(formatIdentity)) return false;

    seenStreamFormats.add(formatIdentity);
    return true;
  });

  if (validStreams.length !== streams.length) {
    debugLog('STREAM', `filtered duplicate displayed formats`, {
      original: streams.length,
      valid_unique: validStreams.length
    });
  }

  return validStreams;'''
          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Expected stream deduplication block was not found exactly once')
          path.write_text(new_text)
          PY

      - name: Commit stream deduplication fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: deduplicate streams by displayed format"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4.128.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish to Stremio Central Catalog
        run: npm run publish:central

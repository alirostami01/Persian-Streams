name: Apply stream dedupe fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch addon
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('addon.js')
          s = p.read_text()
          start = s.index("  // Validate stream objects and remove duplicate URLs.")
          end = s.index("  return validStreams;", start) + len("  return validStreams;")
          new = '''  // Validate stream objects and remove duplicate physical files.
  // Query strings may contain temporary/signing parameters, so dedupe by the
  // actual file path rather than the complete URL.
  const seenStreamKeys = new Set();
  const validStreams = streams.filter(s => {
    if (!s || !s.url || typeof s.url !== 'string' || !s.url.startsWith('http')) {
      return false;
    }

    let streamKey = s.url.trim();
    try {
      const parsed = new URL(streamKey);
      parsed.hash = '';
      parsed.search = '';
      parsed.hostname = parsed.hostname.toLowerCase();
      streamKey = parsed.toString().replace(/\\/$/, '');
    } catch (_) {
      streamKey = streamKey.split('#')[0].split('?')[0].replace(/\\/$/, '');
    }

    if (seenStreamKeys.has(streamKey)) {
      return false;
    }

    seenStreamKeys.add(streamKey);
    return true;
  });

  if (validStreams.length !== streams.length) {
    debugLog('STREAM', `filtered duplicate/invalid streams`, {
      original: streams.length,
      valid_unique: validStreams.length,
      removed: streams.length - validStreams.length
    });
  }

  return validStreams;'''
          p.write_text(s[:start] + new + s[end:])
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-dedupe-fix.yml
          git add addon.js .github/workflows/apply-dedupe-fix.yml
          git commit -m 'fix: deduplicate streams by physical file'
          git push
name: Apply Worker refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor addon for Worker compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('addon.js')
          s = p.read_text()

          s = s.replace("const express = require('express');\n", '')
          s = s.replace("const path = require('path');\n", '')
          s = s.replace("require('dotenv').config();\n", '')
          s = s.replace("const PORT = process.env.PORT || 8000;\n", '')

          marker = "\n// Start server if run directly\n"
          if marker not in s:
              raise SystemExit('Expected addon.js server block was not found')
          s = s.split(marker, 1)[0].rstrip() + "\n\n"

          s = s.replace("// Export addon interface\nmodule.exports = builder.getInterface();", "const addonInterface = builder.getInterface();\n\n// Export the SDK interface plus the pure stream function. The Worker uses\n// getStreams directly and does not load the legacy Express runtime.\nmodule.exports = {\n  ...addonInterface,\n  getStreams\n};")

          if 'module.exports = builder.getInterface();' in s:
              raise SystemExit('Expected export replacement did not happen')

          p.write_text(s)
          PY

          cat > server.js <<'EOF'
          require('dotenv').config();
          const express = require('express');
          const path = require('path');
          const { getRouter } = require('stremio-addon-sdk');
          const addonInterface = require('./addon.js');

          const PORT = process.env.PORT || 8000;
          const app = express();

          app.get('/manifest.json', (req, res) => {
            const protocol = req.get('x-forwarded-proto') || req.protocol || 'http';
            const host = req.get('host') || `localhost:${PORT}`;
            const manifest = {
              ...addonInterface.manifest,
              logo: `${protocol}://${host}/assets/icons/logo.png`
            };
            res.setHeader('Content-Type', 'application/json; charset=utf-8');
            res.end(JSON.stringify(manifest));
          });

          app.use(getRouter(addonInterface));
          app.use('/assets/icons', express.static(path.join(__dirname, 'assets', 'icons')));

          app.get('/', (_, res) => {
            res.setHeader('content-type', 'text/html; charset=utf-8');
            res.end(
              `<h1>${addonInterface.manifest.name}</h1>` +
              `<p>${addonInterface.manifest.description}</p>` +
              `<p>${addonInterface.manifest.author}</p>` +
              `<p>Install: <a href="stremio://localhost:${PORT}/manifest.json">stremio://localhost:${PORT}/manifest.json</a></p>`
            );
          });

          const server = app.listen(PORT, () => {
            console.log(`${addonInterface.manifest.name} running on port ${PORT}`);
            console.log(`Manifest: http://localhost:${PORT}/manifest.json`);
          });

          server.on('error', (error) => {
            if (error.code === 'EADDRINUSE') {
              console.error(`Port ${PORT} is already in use.`);
              process.exit(1);
            }
            console.error('Server error:', error);
            process.exit(1);
          });
          EOF

          cat > worker.js <<'EOF'
          import { env } from 'cloudflare:workers';
          import { createRequire } from 'node:module';

          // addon.js reads BASE_URL when it is initialized. Mirror the Worker
          // binding before loading the CommonJS addon module.
          process.env.BASE_URL = env.BASE_URL;

          const require = createRequire(import.meta.url);
          const { manifest, getStreams } = require('./addon.js');

          function json(data, status = 200, extraHeaders = {}) {
            return new Response(JSON.stringify(data), {
              status,
              headers: {
                'content-type': 'application/json; charset=utf-8',
                'access-control-allow-origin': '*',
                ...extraHeaders,
              },
            });
          }

          function withAbsoluteLogo(request) {
            const url = new URL(request.url);
            return {
              ...manifest,
              logo: `${url.origin}/streams/assets/icons/logo.png`,
            };
          }

          function parseStreamRequest(pathname) {
            const match = pathname.match(/^\/streams\/stream\/(movie|series)\/(.+?)(?:\.json)?\/?$/);
            if (!match) return null;
            return { type: match[1], id: decodeURIComponent(match[2]) };
          }

          async function handleStream(request, streamRequest) {
            try {
              const result = await getStreams(streamRequest.type, ...(() => {
                const { type, id } = streamRequest;
                if (type !== 'series') return [id, null, null];
                const parts = id.split(':');
                return [parts[0], parts[1] ? parseInt(parts[1], 10) : null, parts[2] ? parseInt(parts[2], 10) : null];
              })());

              return json({ streams: result || [] });
            } catch (error) {
              console.error('Worker stream handler error:', error);
              return json({ streams: [] }, 200);
            }
          }

          export default {
            async fetch(request, env, ctx) {
              const url = new URL(request.url);
              const { pathname } = url;

              if (pathname === '/' || pathname === '/streams' || pathname === '/streams/') {
                if (pathname === '/') {
                  return json({
                    name: manifest.name,
                    status: 'ok',
                    manifest: '/streams/manifest.json',
                  });
                }
                return Response.redirect(`${url.origin}/streams/manifest.json`, 302);
              }

              if (pathname === '/streams/manifest.json') {
                return json(withAbsoluteLogo(request));
              }

              if (pathname.startsWith('/streams/assets/')) {
                const assetPath = pathname.replace(/^\/streams\/assets/, '') || '/';
                const assetRequest = new Request(`https://assets.local${assetPath}`, request);
                return env.ASSETS.fetch(assetRequest);
              }

              const streamRequest = parseStreamRequest(pathname);
              if (streamRequest && request.method === 'GET') {
                return handleStream(request, streamRequest);
              }

              return json({ error: 'Not found' }, 404);
            },
          };
          EOF

          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('package.json')
          data = json.loads(p.read_text())
          data['main'] = 'server.js'
          data['scripts'] = {
              'start': 'node server.js',
              'dev': 'node --watch server.js'
          }
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY

          rm -f .github/workflows/worker-refactor-once.yml

      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add addon.js server.js worker.js package.json .github/workflows/worker-refactor-once.yml
          git commit -m 'refactor: separate Worker adapter from Express runtime'
          git push
